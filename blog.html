  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<div class="page">
  <nav class="nav" aria-label="Site">
    <a class="brand" href="index.html">Home</a>
    <div class="menu">
      <button class="menu-btn" aria-expanded="false" aria-controls="menu-list" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <div class="menu-list" id="menu-list">
        <a href="projects.html">Projects</a>
        <a href="publications.html">Publications</a>
        <a href="sky.html">Sky</a>
        <a href="blog.html" aria-current="page">Blog</a>
      </div>
    </div>
    <a href="about.html">About</a>
  </nav>

  <section>
    <h2>Blog</h2>
    <p class="prose">Things I've figured out, written down so I don't have to figure them out twice.</p>
    <div id="posts" class="post-list" aria-live="polite"></div>
  </section>

  <footer>
    <span>© 2026 Sruja Brahmbhatt</span>
  </footer>
</div>

<script src="sky.js"></script>
<script src="nav.js"></script>
<script>
(async function () {
  const el = document.getElementById('posts');
  let posts = [];
  try {
    posts = await (await fetch('posts/index.json', { cache: 'no-store' })).json();
  } catch (e) {
    el.innerHTML = '<p class="empty">Couldn’t load posts/index.json. Serve the folder over http, or push to GitHub Pages.</p>';
    return;
  }
  if (!posts.length) { el.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
  posts.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  for (const p of posts) {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML =
      `<h3><a href="post.html?p=${encodeURIComponent(p.slug)}">${p.title}</a></h3>` +
      `<p class="meta">${fmt(p.date)}</p>` +
      (p.summary ? `<p>${p.summary}</p>` : '');
    el.appendChild(div);
  }
})();
</script>
</body>
</html>
